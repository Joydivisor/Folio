name: Build macOS and Linux
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options: [all, mac-arm64, mac-x64, linux-x64]
      release_tag:
        description: Existing draft release to receive verified packages (leave empty to build only)
        required: false
        type: string
permissions:
  contents: write
env:
  electron_config_cache: ${{ github.workspace }}/.electron-cache
jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'mac-arm64' && '[{"os":"macos-26","artifact":"mac-arm64"}]' || inputs.platform == 'mac-x64' && '[{"os":"macos-15-intel","artifact":"mac-x64"}]' || inputs.platform == 'linux-x64' && '[{"os":"ubuntu-22.04","artifact":"linux-x64"}]' || '[{"os":"macos-26","artifact":"mac-arm64"},{"os":"macos-15-intel","artifact":"mac-x64"},{"os":"ubuntu-22.04","artifact":"linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Read Electron cache version
        id: electron-version
        shell: bash
        run: node -e "process.stdout.write('version='+require('./package-lock.json').packages['node_modules/electron'].version+'\n')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron-version.outputs.version }}
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm test
      - name: Build platform package
        id: package
        run: npm run package:unix
      - name: Validate disk image and runtime on macOS
        if: runner.os == 'macOS'
        run: |
          hdiutil verify releases/*.dmg
          node scripts/smoke-desktop.mjs
          node scripts/test-library-restart.cjs
      - name: Install, launch and uninstall Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ./releases/*.deb
          FOLIO_SMOKE_EXECUTABLE=/opt/Folio/Folio xvfb-run -a node scripts/smoke-desktop.mjs
          FOLIO_TEST_ARCHIVE=/opt/Folio/resources/app.asar xvfb-run -a node scripts/test-library-restart.cjs
          sudo apt-get remove -y folio
          test ! -e /opt/Folio/Folio
      - name: Upload verified packages to the release draft
        id: release-upload
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOLIO_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/upload-release.mjs
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checks
          path: |
            dist/v*/package-audit.json
            dist/v*/runtime-smoke.json
            dist/v*/build-timing.json
            dist/v*/release-upload.json
            dist/v*/release-preflight.json
            tests/reports/library-restart.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain packages when not already in the release
        if: always() && steps.package.outcome == 'success' && (inputs.release_tag == '' || steps.release-upload.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            releases/*.dmg
            releases/*.deb
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
